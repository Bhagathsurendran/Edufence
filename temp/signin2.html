<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Architect Sign Up</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      display: flex;
      max-width: 850px;
      width: 90%;
      background-color: #111;
      border-radius: 15px;
      overflow: hidden;
      color: #fff;
    }

    .left {
      flex: 1;
      position: relative;
      min-height: 400px; /* Reduced from 600px */
      padding: 20px;    
      overflow: hidden;
      display: flex;
      align-items: flex-end;
    }

    .left video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    .left-text {
      position: relative;
      z-index: 1;
      background: rgba(0, 0, 0, 0.5);
      padding: 20px;
      border-radius: 10px;
    }

    .left-text h2 {
      font-size: 20px;
      margin-bottom: 10px;
    }

    .left-text p {
      font-size: 14px;
      color: #ccc;
    }

    .right {
      flex: 1;
      background-color: #0e0e0e;
      padding: 30px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      color: #ccc;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 9px;
      border: none;
      border-radius: 6px;
      background-color: #1e1e1e;
      color: #fff;
    }

    .btn {
      width: 100%;
      padding: 12px;
      background-color: #b5d58c;
      color: #000;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn:hover {
      background-color: #a4c47d;
    }

    .signin {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
    }

    .signin a {
      color: #8cd1ff;
      text-decoration: none;
    }

    .signin a:hover {
      text-decoration: underline;
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }
      .left {
        min-height: 300px;
      }
      .right {
        padding: 30px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <img src="/img/white-Photoroom (1).png" style="height: 100px;position: absolute;z-index: 1;" alt="">
    <div class="left">
      <video autoplay muted loop>
        <source src="/img/PinDown.io_1754325707.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
      <div class="left-text">
        <h2>Join the future of design and engineering.</h2>
        <p>Where your ideas take form and function.</p>
      </div>
    </div>

    <div class="right">
      <h2 style="margin-bottom: 30px; margin-top: 20px;">Create Teacher Account</h2>
      <form>
        <div class="form-group">
          <label for="fullname">Full Name</label>
          <input type="text" id="fullname" placeholder="e.g. Andrew Thomas" required>
        </div>

        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="e.g. andrew123" required>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="e.g. andrew@example.com" required>
        </div>

        <div class="form-group">
          <label for="student-id">Student ID</label>
          <input type="text" id="student-id" placeholder="e.g. STU1234567" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="********" required>
        </div>

        <div class="form-group">
          <label for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password" placeholder="********" required>
        </div>

        <button type="submit" class="btn">Sign Up</button>

        <div class="signin">
          Already have an account? <a href="#">Log in</a>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
