<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Navbar Example</title>
  <style>
    :root{
      --blue:#0b7bff; --bg:#f6f8fb; --card:#ffffff; --muted:#7b8ea3; --accent:#0b7bff;
      --radius:12px; --soft-shadow: 0 6px 18px rgba(11,123,255,0.06);
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: black;
      font-family: Arial, sans-serif;
      color: white;
    }
    .nav {
      background: linear-gradient(to right, #6900af, #000000);
      height: 50px;
      width: 100%;
    } 
    .main {
      display: flex;
      height: 100%;
    }
    .navLeft {
      background-color: rgb(34, 34, 34);
      height: 100%;
      width: 170px;
      
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .navRight {
      flex-grow: 1;
      height: 93vh;
      background-color: white;
      display: none; /* hide by default */
    }
    .navRight.active {
      display: block; /* show only active one */
    }
    .navBtn{
        width: 100%;height: 40px;background-color: rgb(0, 0, 0);
        transition: .5s;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .navBtn:hover{
      background-color: rgb(30, 30, 30);
    }
    .navBtn-1{
      margin-top: 30px;
    }
    .container{
      max-width:1200px;
      
      padding:20px 38px;
    }
    h1{
      font-size:28px;
      margin:8px 0
    }
    .subtitle{
      color:var(--muted);
      margin-bottom:18px
    }

     /* metrics */
    .metrics{
      display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:18px 0;color: rgb(255, 255, 255);
    }
    .metric{
      background:linear-gradient(135deg,#202020,#040404);padding:18px;border-radius:12px;box-shadow:var(--soft-shadow);display:flex;justify-content:space-between;align-items:center;width: 300px;
    }
    .metric small{
      display:block;color:var(--muted);
    }
    .metric .num{
      font-size:20px;font-weight:700;
    }

    /* today's classes */
    .card{background:var(--card);border-radius:10px;padding:16px;box-shadow:0 6px 16px rgba(35,52,69,0.04)}
    .today-wrap{margin-top:10px}
    .today-header{display:flex;align-items:center;justify-content:space-between;background:var(--blue);color:#fff;padding:10px 14px;border-radius:8px}
    .class-list{display:flex;gap:12px;padding:14px}
    .class-item{flex:1;border-radius:8px;border:2px solid #e6f0ff;padding:14px;background:linear-gradient(180deg,#fff,#fbfdff)}
    .class-item h3{margin:0 0 8px;font-size:18px;color:var(--blue)}
    .meta{display:flex;gap:14px;color:var(--muted);font-size:14px;margin-bottom:10px}
    .class-actions{display:flex;gap:8px}
    .btn{border:1px solid #e6eefc;background:#fff;padding:8px 12px;border-radius:8px;cursor:pointer}
    .btn.primary{background:transparent;border:2px solid var(--blue);color:var(--blue)}


  </style>
</head>
<body>
  <div class="nav" style="display: flex;justify-content: space-between;justify-items: center;">
    <div class="nav-logo">
      <img src="/img/white-Photoroom (1).png" style="height: 60px;" alt="">
    </div>
    <div value="nav-profile" style="display: flex;align-items: center;padding-right: 25px;" alt="">
      <p>Welcome Bhagath</p>
    </div>
  </div>

x
  <div class="main">
    <div class="navLeft">
      <div class="navBtn-1 navBtn">DASHBOARD</div>
      <div class="navBtn-2 navBtn">CREATE CLASS</div>
    </div>
    <div class="container">
         <h1>Teacher Dashboard</h1>
         <div class="subtitle">Welcome back, Bhagath! Here's your class overview.</div>

          <div class="metrics">
            <div class="metric"><div><small>Total Classes</small><div class="num" id="totalClasses">3</div></div><div>📚</div></div>
            <div class="metric"><div><small>Today's Classes</small><div class="num" id="todayClasses">2</div></div><div>📅</div></div>
            <div class="metric"><div><small>Total Students</small><div class="num" id="totalStudents">3</div></div><div>👥</div></div>
            <div class="metric"><div><small>Active Classes</small><div class="num" id="activeClasses">3</div></div><div>▶️</div></div>
          </div>

          <div class="classView" style="height: 300px;background-color: red;width: 1250px;border-radius: 12px;">
            <div class="" style="width: 100%;height: 40px;background-color: blue;border-top-left-radius: 12px;border-top-right-radius: 12px;display: flex;align-items: center;">
                <p style="color: black;margin-left: 20px;">Today's Classes</p>
            </div>
            <div class="" style="width: 100%;height: 100%;background-color: rgb(0, 255, 30);display: flex;align-items: center;gap: 20px;justify-content: center;">
              <div class="" style="width: 350px;height: 200px;background-color: #000000;border-radius: 20px;">
                <p>Today</p>
                <p>15:00 - 16:00</p>
                <p>Today</p>
                <p>1 Students</p>

                <div class="">
                  <input type="button" name="" id="" style="width: 100px;height: 30px;border-top-left-radius: 10px;border-bottom-left-radius: 10px;">
                   <input type="button" name="" id="" style="width: 100px;height: 30px;border-top-right-radius: 10px;border-bottom-right-radius: 10px;">
                  
                </div>
              </div>          
            </div>
          </div>


          <div class="AllClass" style="height: 300px;background-color: red;width: 1250px;border-radius: 12px;margin-top: 70px;">
            
          </div>
    </div>
  </div>
</body>
</html>
