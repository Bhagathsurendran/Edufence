<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Teacher Dashboard</title>
  <style>
    :root{
      --blue:#0b7bff; --bg:#f6f8fb; --card:#ffffff; --muted:#7b8ea3; --accent:#0b7bff;
      --radius:12px; --soft-shadow: 0 6px 18px rgba(11,123,255,0.06);
    }
    *{box-sizing:border-box}
    body{font-family:Inter,ui-sans-serif,system-ui,Arial;color:#233445;margin:0;background:var(--bg)}

    /* topbar */
    .topbar{background:linear-gradient(90deg,#1877f2,#2fb1ff);padding:18px 28px;color:#fff;display:flex;align-items:center;justify-content:space-between}
    .brand{display:flex;align-items:center;gap:14px;font-weight:700;font-size:20px}
    .brand .logo{width:36px;height:36px;border-radius:8px;background:rgba(255,255,255,0.12);display:flex;align-items:center;justify-content:center}
    .top-actions{display:flex;align-items:center;gap:14px}
    .user{display:flex;align-items:center;gap:10px}
    .avatar{width:36px;height:36px;border-radius:50%;background:#fff;color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:700}

    /* container */
    .container{max-width:1200px;margin:28px auto;padding:0 18px}
    h1{font-size:28px;margin:8px 0}
    .subtitle{color:var(--muted);margin-bottom:18px}

    /* metrics */
    .metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:18px 0}
    .metric{background:linear-gradient(135deg,#ffffff,#f7fbff);padding:18px;border-radius:12px;box-shadow:var(--soft-shadow);display:flex;justify-content:space-between;align-items:center}
    .metric small{display:block;color:var(--muted)}
    .metric .num{font-size:20px;font-weight:700}

    /* today's classes */
    .card{background:var(--card);border-radius:10px;padding:16px;box-shadow:0 6px 16px rgba(35,52,69,0.04)}
    .today-wrap{margin-top:10px}
    .today-header{display:flex;align-items:center;justify-content:space-between;background:var(--blue);color:#fff;padding:10px 14px;border-radius:8px}
    .class-list{display:flex;gap:12px;padding:14px}
    .class-item{flex:1;border-radius:8px;border:2px solid #e6f0ff;padding:14px;background:linear-gradient(180deg,#fff,#fbfdff)}
    .class-item h3{margin:0 0 8px;font-size:18px;color:var(--blue)}
    .meta{display:flex;gap:14px;color:var(--muted);font-size:14px;margin-bottom:10px}
    .class-actions{display:flex;gap:8px}
    .btn{border:1px solid #e6eefc;background:#fff;padding:8px 12px;border-radius:8px;cursor:pointer}
    .btn.primary{background:transparent;border:2px solid var(--blue);color:var(--blue)}

    /* table */
    .table-wrap{margin-top:20px}
    table{width:100%;border-collapse:collapse;background:var(--card);border-radius:10px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,0.04)}
    th,td{padding:12px;text-align:left;border-bottom:1px solid #f0f3f7;font-size:14px}
    thead th{background:#f7fafc;color:#44566a}
    .badge{background:#e8f7ff;color:var(--blue);padding:6px 10px;border-radius:6px;font-weight:600}
    .status.ended{background:#ffdfe0;color:#c8232c;padding:6px 10px;border-radius:6px}
    .status.not-today{background:#efefef;color:#6b6b6b;padding:6px 10px;border-radius:6px}

    /* responsive */
    @media (max-width:900px){.metrics{grid-template-columns:repeat(2,1fr)}.class-list{flex-direction:column}}
    @media (max-width:560px){.metrics{grid-template-columns:1fr}.topbar{padding:12px}.brand{font-size:16px}}
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand"><div class="logo">🎓</div> Welcome to FUNda</div>
    <div class="top-actions">
      <button class="btn" id="createBtn">+ Create New Class</button>
      <div class="user"><div class="avatar">A</div><div class="user-info"><div>Adheel</div><small style="color:rgba(255,255,255,0.9)">Teacher</small></div></div>
    </div>
  </div>

  <div class="container">
    <h1>Teacher Dashboard</h1>
    <div class="subtitle">Welcome back, Adheel! Here's your class overview.</div>

    <div class="metrics">
      <div class="metric"><div><small>Total Classes</small><div class="num" id="totalClasses">3</div></div><div>📚</div></div>
      <div class="metric"><div><small>Today's Classes</small><div class="num" id="todayClasses">2</div></div><div>📅</div></div>
      <div class="metric"><div><small>Total Students</small><div class="num" id="totalStudents">3</div></div><div>👥</div></div>
      <div class="metric"><div><small>Active Classes</small><div class="num" id="activeClasses">3</div></div><div>▶️</div></div>
    </div>

    <div class="card today-wrap">
      <div class="today-header"><div>📅 Today's Classes</div><div></div></div>
      <div class="class-list" id="todayList">
        <!-- JS inserts class items -->
      </div>
    </div>

    <div class="table-wrap">
      <h3 style="margin:12px 0">All Classes <button class="btn" style="float:right">+ Add Class</button></h3>
      <table>
        <thead><tr><th>Subject</th><th>Class Code</th><th>Schedule</th><th>Location</th><th>Students</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="classTable">
          <!-- JS rows -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const classes = [
      {subject:'test', code:'213123', schedule:'Monday\n15:00 - 16:00', location:'CS LAB', students:1, status:'not-today'},
      {subject:'today', code:'DAAS', schedule:'Wednesday\n15:00 - 16:00', location:'today', students:1, status:'ended'},
      {subject:'Tod', code:'SJ', schedule:'Wednesday\n15:40 - 16:40', location:'Hs', students:1, status:'ended'}
    ];

    function renderToday(){
      const todayList = document.getElementById('todayList');
      const todayClasses = classes.filter(c => c.status !== 'not-today').slice(0,2);
      todayList.innerHTML = '';
      todayClasses.forEach(c=>{
        const div = document.createElement('div'); div.className='class-item';
        div.innerHTML = `<h3>${c.subject}</h3>
          <div class="meta"><div>🕒 ${c.schedule.split('\n')[1] || ''}</div><div>📍 ${c.location}</div><div>👥 ${c.students} students</div></div>
          <div class="class-actions"><button class="btn primary">Attendance</button><button class="btn">Students</button></div>`;
        todayList.appendChild(div);
      });
      document.getElementById('todayClasses').textContent = todayClasses.length;
    }

    function renderTable(){
      const tbody = document.getElementById('classTable'); tbody.innerHTML='';
      classes.forEach(c=>{
        const tr = document.createElement('tr');
        tr.innerHTML = `<td><strong>${c.subject}</strong><div style="color:var(--muted);font-size:12px">${c.subject.toLowerCase().slice(0,20)}</div></td>
          <td><span class="badge">${c.code}</span></td>
          <td>${c.schedule.replace('\n','<br>')}</td>
          <td>📍 ${c.location}<div style="color:var(--muted);font-size:12px">1m radius</div></td>
          <td><span class="badge">${c.students} students</span></td>
          <td>${c.status==='ended'? '<span class="status ended">Ended</span>':'<span class="status not-today">Not Today</span>'}</td>
          <td><button class="btn">📈</button><button class="btn">👥</button><button class="btn">✏️</button></td>`;
        tbody.appendChild(tr);
      });
      document.getElementById('totalClasses').textContent = classes.length;
      document.getElementById('totalStudents').textContent = classes.reduce((s,a)=>s+a.students,0);
      document.getElementById('activeClasses').textContent = classes.length;
    }

    renderToday(); renderTable();

    document.getElementById('createBtn').addEventListener('click', ()=>{
      alert('Create Class dialog — implement modal as needed.');
    });
  </script>
</body>
</html>
